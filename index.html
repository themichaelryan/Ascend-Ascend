<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // >>> REPLACE THIS BLOCK with the config from your Firebase project <<<
  const firebaseConfig = {

    appId: "PASTE_APP_ID"
  };

  // expose a small bridge for the main script to use
  window.__fb = { ready:false, config:firebaseConfig };
  try {
    if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "PASTE_API_KEY") {
      const app  = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db   = getFirestore(app);
      window.__fb = {
        ready:true, auth, db, user:null,

        signup:(e,p)=>createUserWithEmailAndPassword(auth,e,p),

        cloudGet:async(uid)=>{ const snap=await getDoc(doc(db,'hunters',uid)); return snap.exists()?snap.data():null; },
        cloudSet:async(uid,data)=>{ await setDoc(doc(db,'hunters',uid),{ data, updatedAt:Date.now() }); },

</script>

  const QUEST_YEARS = 10;
  const QUEST_TOTAL_DAYS = 3653; // ~10 years incl. leap days
  // returns {day, year, yearOf, pctYear, pctTotal, yearsLeft, dateLabel}

    const start=state.startDate;
    const dayIdx=dbtw(start, todayKey()); // 0-based days elapsed
    const day=dayIdx+1;
    const year=Math.min(QUEST_YEARS, Math.floor(dayIdx/365.25)+1);
    const dayInYear=Math.floor(dayIdx - (year-1)*365.25)+1;
    const pctTotal=Math.min(100, dayIdx/QUEST_TOTAL_DAYS*100);
    const pctYear=Math.min(100, dayInYear/365.25*100);
    const endDate=new Date(new Date(start).getTime()+QUEST_TOTAL_DAYS*86400000);

  const TIER_BOUNDS=[40,90,160,260,410,640,950]; // 7 tiers, then Ascendant
  function tierForLevel(lv){
    lv=Math.max(1,Math.min(1000,lv));
    const romans=['V','IV','III','II','I'];

    let lo=1;
    for(let i=0;i<TIER_BOUNDS.length;i++){
      const hi=TIER_BOUNDS[i];
      if(lv<=hi){ const span=hi-lo+1; const div=Math.min(4,Math.floor((lv-lo)/(span/5))); const t=TIERS[i]; return { tier:t.n, div:romans[div], color:t.c, label:t.n+' '+romans[div] }; }

      });
      if(state.lastAllClearDay&&dbtw(state.lastAllClearDay,t)>1){ if(state.globalStreak){state.globalStreak=0;broke=true;} }

  function todaysCard(){ const d=todayKey(); let h=0; for(let i=0;i<d.length;i++) h=(h*31+d.charCodeAt(i))>>>0; return CARDS[h%CARDS.length]; }
  // Hunter level now tracks the decade-scaled Overall attribute level (1..1000), so "my level"
  // and "my rating" are one unified climb across the 10-year quest. The XP total still accrues
  // (shown on Stats) but the level bar reflects Overall-level progress.
  function recompute(){ if(state){ state.level=overallLevel(state); updateUnlockedClasses(state); } }
  // progress within the current Overall level, expressed as XP-into / XP-need for the bar.
  function levelProgress(){
    const p=attrPoints(state); // average the per-attribute "into/need" for a smooth bar
    let into=0, need=0;
    ATTRS.forEach(a=>{ const lf=levelFromPoints(p[a.key]); into+=lf.into; need+=lf.need; });
    return { into:Math.round(into/ATTRS.length), need:Math.max(1,Math.round(need/ATTRS.length)) };
  }
  function levelFloor(){ return 0; } // retained for compatibility

  // ---- attribute points ----
  // Milestones are major achievements: claiming one grants a big attribute boost.
  // Each milestone contributes points spread across attributes tied to its era's theme,
  // scaled by its XP weight (bigger milestone = bigger boost). Roughly: xp/10 total points.
  const ERA_ATTRS={
    runway:   ['discipline','intelligence','wisdom'],
    face:     ['confidence','intelligence','focus'],
    loop:     ['wisdom','discipline','confidence'],
    compound: ['discipline','strength','focus'],
    leap:     ['intelligence','confidence','agility'],
    freedom:  ['wisdom','confidence','strength'],
  };
  function milestoneAttrPoints(s){
    const pts={}; ATTRS.forEach(a=>pts[a.key]=0);
    (s.milestones||[]).forEach(m=>{ if(m.done){ const attrs=ERA_ATTRS[m.era]||['discipline']; const per=Math.round((m.xp||100)/10/attrs.length); attrs.forEach(a=>pts[a]+=per); } });
    return pts;
  }
  // CURRENT: attribute points from all quest completions + claimed milestones.
  function attrPoints(s){
    const pts={}; ATTRS.forEach(a=>pts[a.key]=0);
    s.quests.forEach(q=>{
      const map=QUEST_ATTR[q.icon]||QUEST_ATTR.star;
      const times=(q.history||[]).length;
      for(const k in map) pts[k]+=map[k]*times;
    });
    const mp=milestoneAttrPoints(s); ATTRS.forEach(a=>pts[a.key]+=mp[a.key]);
    return pts;
  }
  // DAY: attribute points earned today only.
  function attrPointsDay(s){
    const t=todayKey(); const pts={}; ATTRS.forEach(a=>pts[a.key]=0);
    s.quests.forEach(q=>{ if((q.history||[]).includes(t)){ const map=QUEST_ATTR[q.icon]||QUEST_ATTR.star; for(const k in map) pts[k]+=map[k]; } });
    return pts;
  }
  // POTENTIAL: your ceiling if every quest were completed every day across the full 10-year quest.
  // This is the decade target each attribute climbs toward (caps at level 1000).
  function attrPointsPotential(s){
    const pts={}; ATTRS.forEach(a=>pts[a.key]=0);
    s.quests.forEach(q=>{ const map=QUEST_ATTR[q.icon]||QUEST_ATTR.star; for(const k in map) pts[k]+=map[k]*QUEST_TOTAL_DAYS; });
    return pts;
  }
  function overallLevel(s){ const p=attrPoints(s); let sum=0; ATTRS.forEach(a=>sum+=levelFromPoints(p[a.key]).level); return Math.round(sum/ATTRS.length); }
  function totalCompletions(s){ return s.quests.reduce((a,q)=>a+(q.history||[]).length,0); }

  // average attribute LEVEL for a class (drives its tier climb + unlock)
  function classAttrLevel(s, classKey){
    const c=CLASSES[classKey]; if(!c) return 0;
    const p=attrPoints(s);
    const sum=c.attrs.reduce((x,a)=>x+levelFromPoints(p[a]||0).level,0);
    return Math.round(sum/c.attrs.length);
  }
  // pick current class = the class with the highest attribute level (or manual override)
  function classFor(s){
    if(s.classOverride && CLASSES[s.classOverride]) return s.classOverride;
    let best=null, bestScore=-1;
    for(const key in CLASSES){ const score=classAttrLevel(s,key); if(score>bestScore){ bestScore=score; best=key; } }
    return bestScore>1?best:null;
  }
  // TIER (0..14) is driven by the CLASS'S OWN attribute level, scaled to 1000 over the decade.
  function classTierIdxFor(s, classKey){
    const al=classAttrLevel(s, classKey);
    return Math.min(CLASS_TIERS-1, Math.floor((al)/(1000/CLASS_TIERS)));
  }
  function classTitle(s){
    const ck=classFor(s);
    if(!ck) return { className:'Novice', classIcon:'\uD83C\uDF31', title:'Unclassed \u2014 train to reveal your path', classKey:null, tierIdx:-1 };
    const c=CLASSES[ck]; const idx=classTierIdxFor(s,ck);
    return { className:c.name, classIcon:c.icon, title:c.tiers[idx].name, classKey:ck, tierIdx:idx };
  }
  function fullTitle(s){
    const lv=s.level||1; const r=rankFor(lv); const ct=classTitle(s);
    return { rank:r.name, rankIcon:r.icon, className:ct.className, classIcon:ct.classIcon, classTitle:ct.title, classKey:ct.classKey, tierIdx:ct.tierIdx };
  }

  // ===== ROLE UNLOCK (either gate: LEVEL or CLASS-ATTRIBUTE level) =====
  // Base game-addiction curve across the decade (easy -> hard). Each role's REAL requirement
  // is this base nudged by a per-quest random offset (rolled once from questSeed, saved forever),
  // so YOUR unlock points are unique and surprising \u2014 but stable, never reshuffling.
  const ROLE_REQ_BASE={
    fighter:  { reqLevel:60,  reqAttr:60,  band:0.20 },  // the hook
    support:  { reqLevel:90,  reqAttr:90,  band:0.20 },
    marksman: { reqLevel:140, reqAttr:140, band:0.22 },
    mage:     { reqLevel:220, reqAttr:220, band:0.22 },
    assassin: { reqLevel:340, reqAttr:340, band:0.25 },
    tank:     { reqLevel:520, reqAttr:520, band:0.25 },
    paladin:  { reqLevel:750, reqAttr:750, band:0.22 },  // the mastery grind
  };
  // deterministic pseudo-random in [-1,1] from a seed + a string key (so it never changes)
  function seededUnit(seed, key){
    let h=seed>>>0; for(let i=0;i<key.length;i++){ h=Math.imul(h^key.charCodeAt(i),2654435761)>>>0; }
    h ^= h>>>15; h=Math.imul(h,2246822507)>>>0; h ^= h>>>13;
    return ((h>>>0)/4294967295)*2-1; // -1..1
  }
  // resolve a role's real requirement for THIS save (base ± band*random, clamped, ordering kept)
  function roleReq(s, key){
    const b=ROLE_REQ_BASE[key]; const seed=s.questSeed||1;
    const rL=seededUnit(seed, 'L'+key), rA=seededUnit(seed, 'A'+key);
    const reqLevel=Math.max(20, Math.round(b.reqLevel*(1+b.band*rL)));
    const reqAttr =Math.max(20, Math.round(b.reqAttr *(1+b.band*rA)));
    return { reqLevel, reqAttr };
  }
  // per-role progress
  function roleProgress(s){
    const lvl=s.level||1;
    const out={};
    for(const key in CLASSES){
      const req=roleReq(s,key);
      const al=classAttrLevel(s,key);
      const pctLevel=Math.min(100, lvl/req.reqLevel*100);
      const pctAttr=Math.min(100, al/req.reqAttr*100);
      const pct=Math.max(pctLevel,pctAttr);
      out[key]={ unlocked: pct>=100, pct:Math.round(pct), byLevel:lvl>=req.reqLevel, byAttr:al>=req.reqAttr, reqLevel:req.reqLevel, reqAttr:req.reqAttr, attrLevel:al };
    }
    return out;
  }
  function classesUnlockedLive(s){ const rp=roleProgress(s); const out={}; for(const k in rp) out[k]=rp[k].unlocked; return out; }
  function updateUnlockedClasses(s){ if(s && !s.questSeed) s.questSeed=Math.floor(Math.random()*1e9); }

  function completeQuest(id){
    const q=state.quests.find(x=>x.id===id); if(!q) return; const t=todayKey(); if(q.lastDone===t) return;
    q.prevDone=q.lastDone;
    if(q.lastDone&&dbtw(q.lastDone,t)===1) q.streak=(q.streak||0)+1; else q.streak=1;
    q.lastDone=t; if(!q.history) q.history=[]; if(!q.history.includes(t)) q.history.push(t);
    let gain=DIFFS[q.diff].xp; const bonus=Math.min(q.streak-1,20)*2; gain+=bonus; state.xp+=gain;
    const all=state.quests.every(x=> x.lastDone===t || (x.weekly && !weeklyDue(x)));
    if(all){ if(state.lastAllClearDay&&dbtw(state.lastAllClearDay,t)===1) state.globalStreak+=1; else if(state.lastAllClearDay!==t) state.globalStreak=1; state.lastAllClearDay=t; }
    const before=state.level; const beforeRank=rankFor(before).name;
    const beforeRoles=classesUnlockedLive(state);
    recompute(); save();
    // detect a newly awakened role -> story hook
    const afterRoles=classesUnlockedLive(state);
    for(const k in afterRoles){ if(afterRoles[k] && !beforeRoles[k]){ setTimeout(()=>toast(CLASSES[k].icon+' The '+CLASSES[k].name+' awakens \u2014 read your Story','gold'),700); break; } }
    if(state.level>before){ lvlup(state.level); const nowRank=rankFor(state.level).name; if(nowRank!==beforeRank){ const r=rankFor(state.level); setTimeout(()=>toast(r.icon+' New rank: '+nowRank+'!','gold'),1900); } }
    else { toast('+'+gain+' XP'+(bonus?' \u00b7 streak +'+bonus:''),q.keystone?'gold':'lime'); if(all) setTimeout(()=>toast('All quests cleared \uD83C\uDF89','gold'),380); }
    render();
  }
  function uncomplete(id){ const q=state.quests.find(x=>x.id===id); if(!q||q.lastDone!==todayKey()) return; const t=todayKey(); q.history=(q.history||[]).filter(d=>d!==t); q.lastDone=q.prevDone||null; state.xp=Math.max(0,state.xp-DIFFS[q.diff].xp); q.streak=Math.max(0,q.streak-1); recompute(); save(); render(); }

  function toggleSub(qid,idx){ const q=state.quests.find(x=>x.id===qid); if(!q) return; q.subs[idx].done=!q.subs[idx].done; save(); render(); }
  function addSub(qid,txt){ txt=txt.trim(); if(!txt) return; const q=state.quests.find(x=>x.id===qid); q.subs.push({t:txt,done:false}); save(); render(); }
  function saveNotes(qid,val){
    const q=state.quests.find(x=>x.id===qid); if(!q) return;
    q.notes=val; // keep as the live draft for today
    if(!q.noteLog) q.noteLog=[];
    const t=todayKey();
    const existing=q.noteLog.find(n=>n.date===t);
    if(val.trim()===''){
      // empty -> remove today's entry if it exists
      q.noteLog=q.noteLog.filter(n=>n.date!==t);
    } else if(existing){
      existing.text=val;
    } else {
      q.noteLog.push({date:t, text:val});
    }
    save();
  }

  function toggleMs(id){ const m=state.milestones.find(x=>x.id===id); if(!m) return; m.done=!m.done;
    if(m.done){ state.xp+=m.xp; const b=state.level; recompute(); save(); if(state.level>b) lvlup(state.level); else toast('Milestone claimed +'+m.xp+' XP & attributes','gold'); }
    else { state.xp=Math.max(0,state.xp-m.xp); recompute(); save(); toast('Milestone unclaimed',''); } render(); }
  function toggleMsSub(mid,idx){ const m=state.milestones.find(x=>x.id===mid); if(!m) return; m.subs[idx].done=!m.subs[idx].done; save(); render(); }

  function delQuest(id){ state.quests=state.quests.filter(q=>q.id!==id); save(); render(); }

  // ===== AUTH / LOGIN SCREEN =====
  let authMode='login'; // 'login' | 'signup'
  function renderAuth(msg){
    const fb=window.__fb;
    const offline = !(fb && fb.ready);
    $root.innerHTML=`<div class="ob"><div class="ob-card">
      <div class="glyph"><svg width="46" height="46" viewBox="0 0 100 100" fill="none"><path d="M50 8 L61 38 L94 38 L67 58 L78 92 L50 72 L22 92 L33 58 L6 38 L39 38 Z" fill="#fff" opacity=".95"/></svg></div>

      ${offline
        ? `<p>Cloud sync isn\u2019t set up yet, so this device will save on its own (no laptop\u2194phone sync). Add your Firebase keys to turn on sync.</p>
           <div class="f"><button class="btn primary" style="width:100%" id="offlinego">Continue on this device</button></div>`
        : `<p>${authMode==='login'?'Log in to sync your progress across all your devices.':'Create an account \u2014 your progress will sync across every device you log in on.'}</p>
           <div class="f">
             <label>EMAIL</label>
             <input id="authemail" type="text" placeholder="you@email.com" autocomplete="username"/>
             <label>PASSWORD</label>
             <input id="authpass" type="password" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022 (6+ characters)" autocomplete="current-password"/>
             <div id="autherr" style="color:var(--rose);font-size:13px;min-height:18px;margin:-6px 2px 10px">${msg||''}</div>
             <button class="btn primary" style="width:100%" id="authgo">${authMode==='login'?'Log in':'Create account'}</button>
             <div style="text-align:center;margin-top:14px;font-size:13px;color:var(--mut);cursor:pointer" id="authswap">
               ${authMode==='login'?'No account yet? <span style="color:var(--brand-2);font-weight:600">Create one</span>':'Already have an account? <span style="color:var(--brand-2);font-weight:600">Log in</span>'}
             </div>
           </div>`}
    </div></div>`;

    if(offline){
      const g=document.getElementById('offlinego');
      if(g) g.addEventListener('click',()=>{ startAppLocal(); });
      return;
    }
    const go=document.getElementById('authgo');
    const swap=document.getElementById('authswap');
    const em=document.getElementById('authemail');
    const pw=document.getElementById('authpass');
    const err=document.getElementById('autherr');
    swap.addEventListener('click',()=>{ authMode=authMode==='login'?'signup':'login'; renderAuth(); });
    async function submit(){
      const e=(em.value||'').trim(), p=(pw.value||'').trim();
      if(!e||!p){ err.textContent='Enter your email and password.'; return; }
      if(authMode==='signup' && p.length<6){ err.textContent='Password must be at least 6 characters.'; return; }
      go.textContent='Please wait\u2026'; go.disabled=true;
      try{
        if(authMode==='signup') await fb.signup(e,p);
        else await fb.login(e,p);
        // onAuth handler takes over from here
      }catch(ex){
        go.disabled=false; go.textContent=authMode==='login'?'Log in':'Create account';
        err.textContent=friendlyAuthError(ex);
      }
    }
    go.addEventListener('click',submit);
    pw.addEventListener('keydown',e=>{ if(e.key==='Enter') submit(); });
  }
  function friendlyAuthError(ex){
    const c=(ex&&ex.code)||''; 
    if(c.includes('email-already-in-use')) return 'That email already has an account \u2014 try logging in.';
    if(c.includes('invalid-email')) return 'That doesn\u2019t look like a valid email.';
    if(c.includes('weak-password')) return 'Password too weak (use 6+ characters).';
    if(c.includes('wrong-password')||c.includes('invalid-credential')) return 'Wrong email or password.';
    if(c.includes('user-not-found')) return 'No account with that email \u2014 create one first.';
    if(c.includes('too-many-requests')) return 'Too many attempts. Wait a moment and try again.';
    return 'Something went wrong. Check your connection and try again.';
  }

      <div class="page-head"><div><h1>The Journey</h1><div class="sub">Your ten-year spine \u00b7 ${state.milestones.filter(m=>m.done).length}/${state.milestones.length} milestones claimed</div></div></div>

  // ===== RATING =====

      <div class="rt-card pot"><div class="rl">Potential</div><div class="rv">${potOv}</div><div class="rt" style="color:${potTier.color}">${potTier.label}</div><div class="rsub">Decade ceiling \u00b7 all quests daily \u00d7 10 yrs</div></div>
      <div class="rt-card day"><div class="rl">Day</div><div class="rv">${dayOv}<span style="font-size:20px">%</span></div><div class="rt">Today\u2019s output</div><div class="rsub">${ATTRS.reduce((x,a)=>x+day[a.key],0)} attribute pts today</div></div>

  // ===== CALENDAR =====
  // Per-day completion data reconstructed from each quest's history array.
  function dayData(dateKey){
    // daily quests define the "total" for a day; weekly quests count as a bonus if done that day.
    const dailyQuests=state.quests.filter(q=>!q.weekly);
    const doneDaily=dailyQuests.filter(q=>(q.history||[]).includes(dateKey));
    const doneAll=state.quests.filter(q=>(q.history||[]).includes(dateKey));
    const total=dailyQuests.length;
    return { done:doneAll.length, total, quests:doneAll, allClear: total>0 && doneDaily.length===total };
  }
  function fmtKey(y,m,d){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
  function heatColor(ratio){
    if(ratio<=0) return null;
    if(ratio>=1) return 'var(--lime)';
    if(ratio>=0.66) return '#7fd41f';
    if(ratio>=0.33) return '#ffb23e';
    return '#ff5c7a';
  }

  function renderCalendar(){
    const now=new Date();
    if(!calCursor) calCursor={ y:now.getFullYear(), m:now.getMonth() };
    const {y,m}=calCursor;
    const first=new Date(y,m,1); const startDow=first.getDay();
    const daysInMonth=new Date(y,m+1,0).getDate();
    const monthName=first.toLocaleString('en-US',{month:'long',year:'numeric'});
    const todayK=todayKey();

    // month stats
    let monthDaysActive=0, monthAllClear=0, monthCompletions=0;
    for(let d=1; d<=daysInMonth; d++){ const k=fmtKey(y,m,d); const dd=dayData(k); if(dd.done>0) monthDaysActive++; if(dd.allClear) monthAllClear++; monthCompletions+=dd.done; }

    // all-time perfect days + active days
    const allDates=new Set(); state.quests.forEach(q=>(q.history||[]).forEach(d=>allDates.add(d)));
    let perfectAll=0; allDates.forEach(k=>{ if(dayData(k).allClear) perfectAll++; });
    const arcDay=dbtw(state.startDate,todayK)+1;
    const consistency=arcDay>0?Math.round(allDates.size/arcDay*100):0;

    // build cells
    let cells='';
    ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>cells+=`<div class="cal-dow">${d}</div>`);
    for(let i=0;i<startDow;i++) cells+=`<div class="cal-cell empty"></div>`;
    for(let d=1; d<=daysInMonth; d++){
      const k=fmtKey(y,m,d);
      const dd=dayData(k);
      const isToday=k===todayK;
      const isFuture=new Date(y,m,d) > new Date(now.getFullYear(),now.getMonth(),now.getDate());
      const isSel=k===calSel;
      const ratio=dd.total?dd.done/dd.total:0;
      const col=heatColor(ratio);
      cells+=`<div class="cal-cell ${isToday?'today':''} ${isSel?'sel':''} ${isFuture?'future':''}" ${isFuture?'':`data-cal="${k}"`}>
        <div class="dn">${d}</div>
        ${dd.allClear?'<div class="allclear">\u2b50</div>':''}
        ${!isFuture&&dd.done>0?`<div class="cnt">${dd.done}/${dd.total}</div>`:''}
        <div class="dbar">${col?`<div class="dfill" style="width:${ratio*100}%;background:${col}"></div>`:''}</div>
      </div>`;
    }

    // selected-day detail
    let detail='';
    if(calSel){
      const dd=dayData(calSel);
      const dateObj=new Date(calSel+'T00:00:00');
      const nice=dateObj.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
      const chips=state.quests.map(q=>{ const hit=(q.history||[]).includes(calSel); return `<div class="cq ${hit?'hit':''}">${ICONS[q.icon]||ICONS.star} ${esc(q.name)}</div>`; }).join('');
      detail=`<div class="cal-detail">
        <div class="cd-date">${nice}</div>
        <div class="cd-sum">${dd.done}/${dd.total} quests cleared${dd.allClear?' \u00b7 \u2b50 perfect day':''}</div>
        <div class="cd-quests">${chips}</div>
      </div>`;
    } else {
      detail=`<div class="cal-detail"><div class="cd-sum">Click any day to see which quests you cleared.</div></div>`;
    }

    const main=`
      <div class="page-head"><div><h1>Calendar</h1><div class="sub">Your completion history, day by day</div></div></div>
      <div class="cal-stats">
        <div class="cal-stat a"><div class="v">${allDates.size}</div><div class="k">Active days total</div></div>
        <div class="cal-stat d"><div class="v">${perfectAll}</div><div class="k">Perfect days (all cleared)</div></div>
        <div class="cal-stat b"><div class="v">${state.globalStreak}</div><div class="k">Current streak</div></div>
        <div class="cal-stat c"><div class="v">${consistency}%</div><div class="k">Consistency (active/quest days)</div></div>
      </div>
      <div class="cal-top">
        <div class="cal-nav"><button data-calmove="-1">\u2039</button><div class="cal-title">${monthName}</div><button data-calmove="1">\u203a</button></div>
        <div class="cal-legend">
          <div class="lg"><span class="sw" style="background:#ff5c7a"></span>low</div>
          <div class="lg"><span class="sw" style="background:#ffb23e"></span>mid</div>
          <div class="lg"><span class="sw" style="background:var(--lime)"></span>all</div>
          <div class="lg">\u2b50 perfect</div>
        </div>
      </div>
      <div class="cal-grid">${cells}</div>
      <div style="margin-top:16px;font-size:13px;color:var(--mut)">This month: <b style="color:var(--txt)">${monthDaysActive}</b> active days \u00b7 <b style="color:var(--amber)">${monthAllClear}</b> perfect \u00b7 <b style="color:var(--lime)">${monthCompletions}</b> total completions</div>
      <div class="slab" style="margin-top:22px"><h3>Daily completions \u00b7 ${monthName}</h3><span class="ct">out of ${state.quests.length}/day</span></div>
      <div class="chart-card">${(()=>{ const vals=[]; for(let d=1;d<=daysInMonth;d++){ const dd=dayData(fmtKey(y,m,d)); vals.push(dd.done); } return barChart(vals, Math.max(state.quests.length,1), '#b8f43a'); })()}</div>
      ${detail}`;
    return shell(main);
  }

        <div class="stat-box a"><div class="v">${done}/${state.quests.length}</div><div class="k">Cleared today</div></div>

        <div class="stat-box c"><div class="v">${totalDone}</div><div class="k">Total completions</div></div>
        <div class="stat-box d"><div class="v">${msDone}/${state.milestones.length}</div><div class="k">Milestones claimed</div></div>
      </div>

      <div class="slab" style="margin-top:28px"><h3>Quests cleared \u00b7 last 30 days</h3><span class="ct">out of ${state.quests.length}/day</span></div>
      <div class="chart-card">${lineChart}</div>

      <div class="slab" style="margin-top:24px"><h3>XP earned \u00b7 last 30 days</h3></div>
      <div class="chart-card">${xpChart}</div>

      <div class="slab" style="margin-top:26px"><h3>Milestones by era</h3></div>
      ${ERAS.map(e=>{const it=state.milestones.filter(m=>m.era===e.key);const dn=it.filter(m=>m.done).length;const p=it.length?Math.round(dn/it.length*100):0;return `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span style="color:${e.color};font-weight:600">${e.name}</span><span style="color:var(--mut)">${dn}/${it.length}</span></div><div class="bar" style="max-width:none"><div class="fill" style="width:${p}%;background:${e.color}"></div></div></div>`;}).join('')}`;

  // ===== REVIEW (weekly / monthly summaries) =====
  function isoWeekKey(d){ // returns {year, week, monday, sunday}
    const dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
    const day=(dt.getUTCDay()+6)%7; // Mon=0
    dt.setUTCDate(dt.getUTCDate()-day+3); // nearest Thursday
    const firstThu=new Date(Date.UTC(dt.getUTCFullYear(),0,4));
    const week=1+Math.round(((dt-firstThu)/86400000 - 3 + ((firstThu.getUTCDay()+6)%7))/7);
    return { year:dt.getUTCFullYear(), week };
  }
  function localKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

  // ===== STORY / SAGA =====
  function renderStory(){

    const rp=roleProgress(state);

    // current class chapter list (tiers reached)

        <div class="story-tiers">${chapters.reverse().join('')}</div>`;

    const main=`

  function renderReview(){
    const dailyTotal=state.quests.filter(q=>!q.weekly).length || 1;
    const startD=new Date(state.startDate+'T00:00:00');
    const today=new Date(); today.setHours(0,0,0,0);

    // gather per-day stats from start → today
    const perDay=[]; // {date, done, perfect, xp}
    for(let d=new Date(startD); d<=today; d.setDate(d.getDate()+1)){
      const k=localKey(d);
      const dd=dayData(k);
      let xp=0; state.quests.forEach(q=>{ if((q.history||[]).includes(k)) xp+=DIFFS[q.diff].xp; });
      perDay.push({ date:new Date(d), k, done:dd.done, perfect:dd.allClear, xp });
    }

    // bucket into periods
    const buckets=new Map();
    perDay.forEach(p=>{
      let key,label,sub;
      if(reviewMode==='weekly'){
        const wk=isoWeekKey(p.date);
        key=wk.year+'-W'+String(wk.week).padStart(2,'0');
        // week range (Mon–Sun)
        const dd=new Date(p.date); const day=(dd.getDay()+6)%7; const mon=new Date(dd); mon.setDate(dd.getDate()-day); const sun=new Date(mon); sun.setDate(mon.getDate()+6);
        label='Week '+wk.week+', '+wk.year;
        sub=mon.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' \u2013 '+sun.toLocaleDateString('en-US',{month:'short',day:'numeric'});
      } else {
        key=p.date.getFullYear()+'-'+String(p.date.getMonth()+1).padStart(2,'0');
        label=p.date.toLocaleDateString('en-US',{month:'long',year:'numeric'});
        sub='';
      }
      if(!buckets.has(key)) buckets.set(key,{key,label,sub,days:0,completions:0,perfect:0,xp:0,bestDone:0});
      const b=buckets.get(key);
      b.days++; b.completions+=p.done; b.xp+=p.xp; if(p.perfect) b.perfect++; if(p.done>b.bestDone) b.bestDone=p.done;
    });

    const rows=[...buckets.values()].reverse(); // newest first
    // current period key
    const curKey=reviewMode==='weekly' ? (()=>{ const wk=isoWeekKey(today); return wk.year+'-W'+String(wk.week).padStart(2,'0'); })() : (today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0'));

    // overall summary
    const totalCompletions=perDay.reduce((a,p)=>a+p.done,0);
    const totalPerfect=perDay.filter(p=>p.perfect).length;
    const totalXP=perDay.reduce((a,p)=>a+p.xp,0);
    const periodsTracked=rows.length;

    const rowHTML = rows.length ? rows.map(b=>{
      const possible=b.days*dailyTotal;
      const rate=possible?Math.round(b.completions/possible*100):0;
      const isCur=b.key===curKey;
      return `<div class="rv-row ${isCur?'current':''}">
        <div class="rv-head">
          <div class="rv-period"><div class="p1">${esc(b.label)}</div>${b.sub?`<div class="p2">${esc(b.sub)}</div>`:''}${isCur?'<div class="now">CURRENT</div>':''}</div>
          <div class="rv-metrics">
            <div class="rv-m done"><div class="v">${b.completions}</div><div class="k">Quests cleared</div></div>
            <div class="rv-m perf"><div class="v">${b.perfect}</div><div class="k">Perfect days</div></div>
            <div class="rv-m xp"><div class="v">${b.xp}</div><div class="k">XP earned</div></div>
            <div class="rv-m rate"><div class="v">${rate}%</div><div class="k">Completion</div></div>
          </div>
        </div>
        <div class="rv-barwrap"><div class="rv-bar"><div class="rv-fill" style="width:${rate}%"></div></div></div>
      </div>`;
    }).join('') : '<div class="rv-empty">No history yet \u2014 complete some quests and your weekly &amp; monthly summaries will build here.</div>';

    const main=`
      <div class="page-head"><div><h1>Review</h1><div class="sub">Your progress summed up by ${reviewMode==='weekly'?'week':'month'}</div></div></div>
      <div class="rv-summary">
        <div class="rv-sum-box a"><div class="v">${totalCompletions}</div><div class="k">Total quests cleared</div></div>
        <div class="rv-sum-box d"><div class="v">${totalPerfect}</div><div class="k">Total perfect days</div></div>
        <div class="rv-sum-box c"><div class="v">${totalXP}</div><div class="k">Total XP earned</div></div>
        <div class="rv-sum-box b"><div class="v">${periodsTracked}</div><div class="k">${reviewMode==='weekly'?'Weeks':'Months'} tracked</div></div>
      </div>
      <div class="rv-toggle">
        <div class="t ${reviewMode==='weekly'?'on':''}" data-rv="weekly">Weekly</div>
        <div class="t ${reviewMode==='monthly'?'on':''}" data-rv="monthly">Monthly</div>
      </div>
      ${rowHTML}`;
    return shell(main);
  }

  // ---- tiny inline SVG chart helpers ----
  function sparkLine(vals, max, color){
    const w=680, h=140, pad=24;
    if(!vals.length) return '';
    const n=vals.length;
    const x=i=> pad + i*(w-2*pad)/(n-1);
    const y=v=> h-pad - (v/max)*(h-2*pad);
    let d=''; vals.forEach((v,i)=>{ d+=(i===0?'M':'L')+x(i).toFixed(1)+','+y(v).toFixed(1); });
    let area=d+`L${x(n-1).toFixed(1)},${h-pad} L${x(0).toFixed(1)},${h-pad} Z`;
    const dots=vals.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.5" fill="${color}"/>`).join('');
    // gridlines
    let grid=''; for(let g=0;g<=max;g++){ const gy=y(g); grid+=`<line x1="${pad}" y1="${gy}" x2="${w-pad}" y2="${gy}" stroke="#23262f" stroke-width="1"/>`; }
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="xMidYMid meet">
      ${grid}
      <path d="${area}" fill="${color}" opacity="0.12"/>
      <path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
    </svg>`;
  }
  function barChart(vals, max, color){
    const w=680, h=140, pad=24; const n=vals.length;
    const bw=(w-2*pad)/n*0.7;
    const gap=(w-2*pad)/n;
    let bars=''; vals.forEach((v,i)=>{ const bh=(v/max)*(h-2*pad); const x=pad+i*gap+(gap-bw)/2; const y=h-pad-bh; bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,bh).toFixed(1)}" rx="2" fill="${color}" opacity="${v>0?0.9:0.15}"/>`; });
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="xMidYMid meet"><line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#23262f"/>${bars}</svg>`;
  }

  // ===== BACKUP / RESTORE =====
  function backupString(){
    return JSON.stringify({ __ascend_backup:true, version:1, exportedAt:new Date().toISOString(), data:state });
  }
  function doExport(){
    try{
      const str=backupString();
      const blob=new Blob([str],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      const stamp=todayKey();
      a.href=url; a.download='ascend-backup-'+stamp+'.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      toast('Backup downloaded \u2b07','lime');
    }catch(e){ toast('Export failed','' ); }
  }
  async function doCopy(){
    const str=backupString();
    try{ await navigator.clipboard.writeText(str); toast('Backup copied \u2014 paste it somewhere safe','lime'); }
    catch(e){
      // fallback: show it in the import box for manual copy
      const box=document.getElementById('impbox'); if(box){ box.style.display='block'; box.value=str; box.focus(); box.select(); toast('Select all & copy this text',''); }
    }
  }
  function restoreFromString(str){
    try{
      const obj=JSON.parse(str.trim());
      const data=obj && obj.__ascend_backup ? obj.data : obj; // accept raw state too
      if(!data || !Array.isArray(data.quests)) throw new Error('not a valid backup');
      if(!confirm('Restore this backup? It will replace all current progress on this device.')) return;
      state=data;
      if(!state.lastSeenDay) state.lastSeenDay=state.startDate||todayKey(); if(!state.questSeed) state.questSeed=Math.floor(Math.random()*1e9);
      recompute(); save();
      toast('Progress restored \uD83C\uDF89','gold');
      tab='today'; render();
    }catch(e){ toast('That doesn\u2019t look like a valid backup',''); }
  }

    document.querySelectorAll('[data-sub]').forEach(el=>el.addEventListener('click',()=>{ const [q,i]=el.dataset.sub.split(':'); toggleSub(+q,+i); }));
    document.querySelectorAll('[data-subbtn]').forEach(el=>el.addEventListener('click',()=>{ const qid=+el.dataset.subbtn; const inp=document.querySelector('[data-subadd="'+qid+'"]'); if(inp&&inp.value.trim()) addSub(qid,inp.value); }));

    document.querySelectorAll('[data-mopen]').forEach(el=>el.addEventListener('click',()=>{ const id=+el.dataset.mopen; openM=openM===id?null:id; render(); }));

    document.querySelectorAll('[data-mssub]').forEach(el=>el.addEventListener('click',()=>{ const [m,i]=el.dataset.mssub.split(':'); toggleMsSub(+m,+i); }));
    document.querySelectorAll('[data-era]').forEach(el=>el.addEventListener('click',()=>{ msEra=el.dataset.era; openM=null; render(); }));
    document.querySelectorAll('[data-attr]').forEach(el=>el.addEventListener('click',()=>{ const k=el.dataset.attr; openA=openA===k?null:k; render(); }));
    document.querySelectorAll('[data-rv]').forEach(el=>el.addEventListener('click',()=>{ reviewMode=el.dataset.rv; render(); }));

    document.querySelectorAll('[data-calmove]').forEach(el=>el.addEventListener('click',()=>{ const dir=+el.dataset.calmove; let mm=calCursor.m+dir, yy=calCursor.y; if(mm<0){mm=11;yy--;} if(mm>11){mm=0;yy++;} calCursor={y:yy,m:mm}; render(); }));
    document.querySelectorAll('[data-cal]').forEach(el=>el.addEventListener('click',()=>{ calSel=calSel===el.dataset.cal?null:el.dataset.cal; render(); }));
    document.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click',()=>delQuest(+el.dataset.del)));
    document.querySelectorAll('[data-diff]').forEach(el=>el.addEventListener('click',()=>{ pendingDiff=el.dataset.diff; render(); }));
    const nq=document.getElementById('nq'),ab=document.getElementById('addb');
    if(ab){ ab.addEventListener('click',()=>{ if(nq.value.trim()) addQuest(nq.value); }); nq.addEventListener('keydown',e=>{if(e.key==='Enter'&&nq.value.trim())addQuest(nq.value);}); }
    const rst=document.getElementById('rst'); if(rst) rst.addEventListener('click',hardReset);
    const lo=document.getElementById('logout'); if(lo) lo.addEventListener('click',()=>{ if(confirm('Log out? Your progress stays synced and will be here when you log back in.')) logout(); });
    const exp=document.getElementById('exp'); if(exp) exp.addEventListener('click',doExport);
    const cpy=document.getElementById('cpy'); if(cpy) cpy.addEventListener('click',doCopy);
    const imp=document.getElementById('imp'); if(imp) imp.addEventListener('click',()=>{ const box=document.getElementById('impbox'), improw=document.getElementById('improw'); if(box){ box.style.display='block'; box.focus(); } if(improw) improw.style.display='flex'; });
    const impfilebtn=document.getElementById('impfilebtn'); if(impfilebtn) impfilebtn.addEventListener('click',()=>{ const f=document.getElementById('impfile'); if(f) f.click(); });
    const impfile=document.getElementById('impfile'); if(impfile) impfile.addEventListener('change',e=>{ const file=e.target.files[0]; if(!file) return; const r=new FileReader(); r.onload=()=>restoreFromString(String(r.result)); r.readAsText(file); });
    const box=document.getElementById('impbox'), improw=document.getElementById('improw');
    // also allow paste-restore: show the text box via a long-press alternative — expose through Copy-as-text fallback and a manual toggle
    const imprestore=document.getElementById('imprestore'); if(imprestore) imprestore.addEventListener('click',()=>{ if(box) restoreFromString(box.value); });
    const impcancel=document.getElementById('impcancel'); if(impcancel) impcancel.addEventListener('click',()=>{ if(box){box.style.display='none';box.value='';} if(improw) improw.style.display='none'; });
  }

  function render(){
    if(!state){ renderOb(); return; }
    if(tab==='today') $root.innerHTML=renderToday();
    else if(tab==='journey') $root.innerHTML=renderJourney();
    else if(tab==='rating') $root.innerHTML=renderRating();
    else if(tab==='stats') $root.innerHTML=renderStats();
    else if(tab==='calendar') $root.innerHTML=renderCalendar();
    else if(tab==='review') $root.innerHTML=renderReview();
    else if(tab==='story') $root.innerHTML=renderStory();
    else $root.innerHTML=renderMe();
    bind();
  }

  // start the app using whatever is already in `state` (local-only mode)
  function startAppLocal(){
    load();
    if(state){ if(!state.lastSeenDay) state.lastSeenDay=state.startDate||todayKey(); if(!state.questSeed) state.questSeed=Math.floor(Math.random()*1e9); const b=rollover(); schedMidnight(); render(); if(b) setTimeout(()=>toast('Welcome back. A missed day reset some streaks.',''),400); }
    else render(); // shows onboarding
  }

  // when a user logs in: pull cloud data (or push local up if cloud is empty), then live-watch
  async function startAppCloud(uid){
    cloudUid=uid;
    $root.innerHTML='<div class="loading">SYNCING\u2026</div>';
    let cloud=null;
    try{ cloud=await window.__fb.cloudGet(uid); }catch(e){ console.error('cloud get failed',e); }
    if(cloud && cloud.data && Array.isArray(cloud.data.quests)){
      state=cloud.data;                       // cloud wins on login
    } else {
      load();                                 // no cloud yet — use local if present
      if(state){ try{ await window.__fb.cloudSet(uid, state); }catch(e){} } // seed cloud from local
    }
    if(state){
      if(!state.lastSeenDay) state.lastSeenDay=state.startDate||todayKey(); if(!state.questSeed) state.questSeed=Math.floor(Math.random()*1e9);
      const b=rollover(); schedMidnight(); render();
      if(b) setTimeout(()=>toast('Welcome back. A missed day reset some streaks.',''),400);
      else toast('Synced \u2601\uFE0F','lime');
    } else {
      render(); // onboarding; once they create a hunter, save() pushes to cloud
    }
    // live sync: if another device writes, update here
    try{
      window.__fb.cloudWatch(uid,(remote)=>{
        if(!remote || !remote.data || !Array.isArray(remote.data.quests) || remote.data.quests.length===0) return;
        // ignore our own just-written echo by comparing serialized state
        const incoming=JSON.stringify(remote.data);
        if(incoming===JSON.stringify(state)) return;
        applyingRemote=true;
        state=remote.data;
        try{ localStorage.setItem(KEY, incoming); }catch(e){}
        render();
        applyingRemote=false;
      });
    }catch(e){ console.error('watch failed',e); }
  }

  function logout(){
    if(window.__fb && window.__fb.ready){ window.__fb.logout(); }
    cloudUid=null; state=null; authMode='login'; renderAuth();
  }

  (function boot(){
    $root.innerHTML='<div class="loading">SUMMONING\u2026</div>';
    function begin(){
      const fb=window.__fb;
      if(fb && fb.ready){
        // wait for Firebase to tell us if a session already exists
        fb.onAuth((user)=>{
          if(user){ startAppCloud(user.uid); }
          else { authMode='login'; renderAuth(); }
        });
      } else {
        // no Firebase configured — offline single-device mode
        renderAuth(); // shows the "continue on this device" path
      }
    }
    if(window.__fb){ begin(); }
    else { window.addEventListener('fb-loaded', begin, { once:true }); setTimeout(()=>{ if(!window.__fb){ window.__fb={ready:false}; begin(); } }, 2500); }

    document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&state){ const b=rollover(); render(); schedMidnight(); if(b) toast('A new day. Some streaks reset.',''); } });
