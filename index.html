<div id="root"></div>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0a0b10;
    --bg-2: #0d0f16;
    --card: #14161e;
    --card-2: #1a1d27;
    --card-3: #1f2330;
    --line: #23262f;
    --line-lit: #313543;
    --txt: #f2f4f8;
    --mut: #8b90a0;
    --dim: #5a5f6e;
    --brand: #6c5ce7;
    --brand-2: #8b7bff;
    --lime: #b8f43a;
    --amber: #ffb23e;
    --rose: #ff5c7a;
    --cyan: #38d9ff;
    --font-d: 'Sora', system-ui, sans-serif;
    --font-b: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  #root { font-family: var(--font-b); color: var(--txt); background: var(--bg); min-height: 100vh; }

  .app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }

  /* ===== SIDEBAR ===== */
  .side { background: var(--bg-2); border-right: 1px solid var(--line); padding: 26px 18px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 11px; padding: 0 6px 24px; }
  .brand .g { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .brand .nm { font-family: var(--font-d); font-weight: 800; font-size: 17px; line-height: 1; }
  .brand .nm small { display: block; font-family: var(--font-b); font-weight: 500; font-size: 10px; color: var(--dim); letter-spacing: .18em; margin-top: 4px; }

  .side-user { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 20px; display: flex; align-items: center; gap: 11px; }
  .side-user .av { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--brand), var(--brand-2)); display: flex; align-items: center; justify-content: center; font-family: var(--font-d); font-weight: 800; font-size: 18px; flex-shrink: 0; }
  .side-user .un { font-family: var(--font-d); font-weight: 700; font-size: 14px; line-height: 1.2; }
  .side-user .ur { font-size: 11px; color: var(--brand-2); margin-top: 2px; }

  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav-i { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 11px; color: var(--mut); cursor: pointer; font-weight: 600; font-size: 14px; transition: all .16s; }
  .nav-i:hover { background: var(--card); color: var(--txt); }
  .nav-i.on { background: var(--card-2); color: var(--txt); }
  .nav-i.on svg { color: var(--brand-2); }
  .nav-i svg { width: 19px; height: 19px; flex-shrink: 0; }
  .nav-i .ct { margin-left: auto; font-size: 11px; color: var(--dim); font-weight: 700; }

  .side-foot { margin-top: auto; padding-top: 16px; }
  .side-streak { background: linear-gradient(135deg, #1c1023, var(--card)); border: 1px solid var(--line); border-radius: 14px; padding: 14px; text-align: center; }
  .side-streak .big { font-family: var(--font-d); font-weight: 800; font-size: 30px; color: var(--rose); line-height: 1; }
  .side-streak .lb { font-size: 11px; color: var(--mut); margin-top: 5px; }

  /* ===== MAIN ===== */
  .main { padding: 0; overflow-x: hidden; }
  .main-inner { max-width: 1080px; margin: 0 auto; padding: 30px 40px 60px; }

  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
  .page-head h1 { font-family: var(--font-d); font-weight: 800; font-size: 28px; letter-spacing: -.02em; }
  .page-head .sub { color: var(--mut); font-size: 14px; margin-top: 4px; }

  /* hero strip */
  .hero { display: grid; grid-template-columns: auto 1fr auto; gap: 24px; align-items: center; background: linear-gradient(135deg, #191630, var(--card) 65%); border: 1px solid var(--line); border-radius: 20px; padding: 22px 26px; margin-bottom: 24px; }
  .ring { position: relative; width: 92px; height: 92px; }
  .ring svg { transform: rotate(-90deg); }
  .ring .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .c .n { font-family: var(--font-d); font-weight: 800; font-size: 28px; line-height: 1; }
  .ring .c .t { font-size: 8px; letter-spacing: .18em; color: var(--mut); text-transform: uppercase; margin-top: 3px; }
  .hero-mid .rk { font-family: var(--font-d); font-weight: 700; font-size: 19px; }
  .hero-mid .dd { font-size: 13px; color: var(--mut); margin-top: 4px; }
  .hero-mid .bar { height: 9px; border-radius: 999px; background: #0b0c12; border: 1px solid var(--line); overflow: hidden; margin-top: 14px; max-width: 440px; }
  .hero-mid .fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--brand), var(--brand-2)); transition: width .7s cubic-bezier(.2,.9,.3,1); }
  .hero-mid .xl { font-size: 12px; color: var(--dim); margin-top: 7px; }
  .hero-stats { display: flex; gap: 26px; }
  .hero-stats .hs { text-align: center; }
  .hero-stats .hs .v { font-family: var(--font-d); font-weight: 800; font-size: 22px; line-height: 1; }
  .hero-stats .hs .k { font-size: 11px; color: var(--mut); margin-top: 6px; }

  /* daily card */
  .daycard { background: linear-gradient(135deg, var(--lime), #8ed420); color: #0a0b10; border-radius: 18px; padding: 20px 24px; margin-bottom: 26px; display: flex; align-items: center; gap: 20px; }
  .daycard .qmark { font-family: var(--font-d); font-size: 46px; font-weight: 800; opacity: .3; line-height: 1; }
  .daycard .dc-body { flex: 1; }
  .daycard .cat { font-family: var(--font-d); font-weight: 700; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; opacity: .6; }
  .daycard .q { font-family: var(--font-d); font-weight: 700; font-size: 18px; line-height: 1.35; margin-top: 6px; }
  .daycard .by { font-size: 12px; font-weight: 600; opacity: .65; margin-top: 8px; }

  /* section label */
  .slab { display: flex; align-items: baseline; justify-content: space-between; margin: 0 2px 14px; }
  .slab h3 { font-family: var(--font-d); font-weight: 700; font-size: 16px; }
  .slab .ct { font-size: 13px; color: var(--mut); }

  /* ===== QUEST CARD ===== */
  .qcard { background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 12px; overflow: hidden; transition: border-color .2s; }
  .qcard:hover { border-color: var(--line-lit); }
  .qcard.done { opacity: .58; }
  .qcard.keystone { border-color: color-mix(in srgb, var(--amber) 40%, var(--line)); }
  .qhead { display: flex; align-items: center; gap: 15px; padding: 16px 18px; cursor: pointer; }
  .q-ic { width: 46px; height: 46px; border-radius: 13px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; background: var(--tint, #23262f); }
  .q-main { flex: 1; min-width: 0; }
  .q-name { font-family: var(--font-d); font-weight: 700; font-size: 16px; line-height: 1.2; }
  .qcard.done .q-name { text-decoration: line-through; color: var(--mut); }
  .q-tags { display: flex; align-items: center; gap: 8px; margin-top: 7px; flex-wrap: wrap; }
  .chip { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 7px; letter-spacing: .02em; }
  .chip.diff { color: #0a0b10; }
  .chip.time { background: var(--card-3); color: var(--mut); }
  .chip.topic { background: color-mix(in srgb, var(--cyan) 15%, transparent); color: var(--cyan); }
  .chip.strk { background: color-mix(in srgb, var(--rose) 15%, transparent); color: var(--rose); }
  .q-act { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  .q-xp { font-family: var(--font-d); font-weight: 700; font-size: 14px; color: var(--amber); }
  .q-tick { width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--line-lit); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .2s; }
  .q-tick:hover { border-color: var(--lime); }
  .q-tick.on { background: var(--lime); border-color: var(--lime); }
  .q-tick svg { opacity: 0; } .q-tick.on svg { opacity: 1; }
  .q-caret { color: var(--dim); transition: transform .2s; }
  .qcard.open .q-caret { transform: rotate(180deg); }

  /* quest detail (expanded) */
  .qdetail { max-height: 0; overflow: hidden; transition: max-height .3s ease; }
  .qcard.open .qdetail { max-height: 720px; }
  .qdetail-in { padding: 4px 18px 20px; border-top: 1px solid var(--line); margin: 0 0 0; }
  .qd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 16px; }
  .qd-block h5 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
  .qd-why { font-size: 13px; color: var(--mut); line-height: 1.6; }
  .qd-stats { display: flex; gap: 22px; }
  .qd-stats .s .v { font-family: var(--font-d); font-weight: 700; font-size: 20px; }
  .qd-stats .s .k { font-size: 11px; color: var(--dim); margin-top: 3px; }
  .qd-stats .s .v.strk { color: var(--rose); }

  /* subtasks */
  .subs { margin-top: 4px; }
  .sub { display: flex; align-items: center; gap: 10px; padding: 7px 0; cursor: pointer; }
  .sub-box { width: 18px; height: 18px; border-radius: 6px; border: 2px solid var(--line-lit); flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all .18s; }
  .sub-box.on { background: var(--brand); border-color: var(--brand); }
  .sub-box svg { opacity: 0; } .sub-box.on svg { opacity: 1; }
  .sub-txt { font-size: 13px; color: var(--txt); }
  .sub.done .sub-txt { text-decoration: line-through; color: var(--dim); }
  .sub-add { display: flex; gap: 8px; margin-top: 8px; }
  .sub-add input { flex: 1; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 8px 11px; color: var(--txt); font-family: var(--font-b); font-size: 13px; outline: none; }
  .sub-add input:focus { border-color: var(--brand); }
  .sub-add button { background: var(--card-3); border: 1px solid var(--line-lit); border-radius: 9px; color: var(--txt); padding: 0 14px; cursor: pointer; font-weight: 600; font-size: 13px; }

  /* notes */
  .notes-ta { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--txt); font-family: var(--font-b); font-size: 13px; line-height: 1.5; outline: none; resize: vertical; min-height: 62px; }
  .notes-ta:focus { border-color: var(--brand); }

  /* history dots */
  .hist { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .hist .dot { width: 15px; height: 15px; border-radius: 4px; background: var(--card-3); border: 1px solid var(--line); }
  .hist .dot.hit { background: var(--lime); border-color: var(--lime); }
  .hist-lab { font-size: 11px; color: var(--dim); margin-top: 8px; }

  /* ===== JOURNEY / MILESTONES ===== */
  .era-strip { display: flex; gap: 9px; flex-wrap: wrap; margin-bottom: 18px; }
  .era-pill { padding: 9px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--card); border: 1px solid var(--line); color: var(--mut); cursor: pointer; transition: all .16s; }
  .era-pill:hover { border-color: var(--line-lit); color: var(--txt); }
  .era-pill.on { color: #0a0b10; border-color: transparent; }

  .era-doc { border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; margin-bottom: 22px; background: var(--card-2); }
  .era-doc .en { font-family: var(--font-d); font-weight: 700; font-size: 20px; }
  .era-doc .ea { font-size: 12px; color: var(--mut); margin-top: 3px; }
  .era-doc .et { font-size: 14px; color: var(--mut); font-style: italic; line-height: 1.6; margin-top: 12px; }

  .mcard { background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 12px; overflow: hidden; transition: border-color .2s; }
  .mcard:hover { border-color: var(--line-lit); }
  .mcard.done { opacity: .58; }
  .mhead { display: flex; align-items: center; gap: 15px; padding: 16px 18px; cursor: pointer; }
  .m-tick { width: 28px; height: 28px; border-radius: 9px; border: 2px solid var(--line-lit); flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .2s; }
  .m-tick:hover { border-color: var(--amber); }
  .m-tick.on { background: var(--amber); border-color: var(--amber); }
  .m-tick svg { opacity: 0; } .m-tick.on svg { opacity: 1; }
  .m-main { flex: 1; min-width: 0; }
  .m-name { font-family: var(--font-d); font-weight: 700; font-size: 15px; line-height: 1.25; }
  .mcard.done .m-name { text-decoration: line-through; }
  .m-meta { display: flex; align-items: center; gap: 8px; margin-top: 7px; flex-wrap: wrap; }
  .m-prog-mini { display: flex; align-items: center; gap: 8px; flex: 1; max-width: 200px; }
  .m-prog-mini .track { flex: 1; height: 6px; border-radius: 999px; background: #0b0c12; border: 1px solid var(--line); overflow: hidden; }
  .m-prog-mini .fillm { height: 100%; background: var(--amber); border-radius: 999px; transition: width .4s; }
  .m-prog-mini .pct { font-size: 11px; color: var(--mut); font-weight: 600; }
  .m-xp { font-family: var(--font-d); font-weight: 700; font-size: 14px; color: var(--amber); flex-shrink: 0; }
  .m-caret { color: var(--dim); transition: transform .2s; }
  .mcard.open .m-caret { transform: rotate(180deg); }

  .mdetail { max-height: 0; overflow: hidden; transition: max-height .3s ease; }
  .mcard.open .mdetail { max-height: 640px; }
  .mdetail-in { padding: 4px 18px 20px; border-top: 1px solid var(--line); }
  .md-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 16px; }
  .md-block h5 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
  .md-txt { font-size: 13px; color: var(--mut); line-height: 1.6; }
  .md-date { display: inline-flex; align-items: center; gap: 7px; background: var(--card-3); border-radius: 8px; padding: 6px 11px; font-size: 12px; color: var(--txt); font-weight: 600; }
  .md-unlock { font-size: 13px; color: var(--lime); line-height: 1.5; }

  /* ===== STATS ===== */
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .stat-box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .stat-box .v { font-family: var(--font-d); font-weight: 800; font-size: 30px; line-height: 1; }
  .stat-box .k { font-size: 13px; color: var(--mut); margin-top: 9px; }
  .stat-box.a .v{color:var(--lime)} .stat-box.b .v{color:var(--rose)} .stat-box.c .v{color:var(--cyan)} .stat-box.d .v{color:var(--amber)}

  /* ===== RATING ===== */
  .rating-hd { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 24px; }
  .rt-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; text-align: center; position: relative; overflow: hidden; }
  .rt-card.cur { background: linear-gradient(150deg, #191630, var(--card) 70%); border-color: color-mix(in srgb, var(--brand) 40%, var(--line)); }
  .rt-card.pot { background: linear-gradient(150deg, #10231a, var(--card) 70%); }
  .rt-card.day { background: linear-gradient(150deg, #231a10, var(--card) 70%); }
  .rt-card .rl { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--mut); }
  .rt-card .rv { font-family: var(--font-d); font-weight: 800; font-size: 44px; line-height: 1; margin-top: 8px; }
  .rt-card.cur .rv { color: var(--brand-2); } .rt-card.pot .rv { color: var(--lime); } .rt-card.day .rv { color: var(--amber); }
  .rt-card .rt { font-size: 12px; margin-top: 6px; font-weight: 600; }
  .rt-card .rsub { font-size: 11px; color: var(--dim); margin-top: 4px; }

  .attr-list { display: flex; flex-direction: column; gap: 10px; }
  .attr-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; transition: border-color .2s; }
  .attr-card:hover { border-color: var(--line-lit); }
  .attr-head { display: flex; align-items: center; gap: 14px; padding: 15px 18px; cursor: pointer; }
  .attr-ic { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 21px; flex-shrink: 0; background: var(--at,#23262f)22; }
  .attr-mid { flex: 1; min-width: 0; }
  .attr-name { font-family: var(--font-d); font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 9px; }
  .attr-tier { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 6px; color: #0a0b10; }
  .attr-bar { height: 7px; border-radius: 999px; background: #0b0c12; border: 1px solid var(--line); overflow: hidden; margin-top: 9px; }
  .attr-fill { height: 100%; border-radius: 999px; transition: width .5s; }
  .attr-lv { text-align: right; flex-shrink: 0; }
  .attr-lv .n { font-family: var(--font-d); font-weight: 800; font-size: 22px; line-height: 1; }
  .attr-lv .l { font-size: 10px; color: var(--dim); letter-spacing: .1em; text-transform: uppercase; margin-top: 3px; }
  .attr-detail { max-height: 0; overflow: hidden; transition: max-height .3s ease; }
  .attr-card.open .attr-detail { max-height: 360px; }
  .attr-detail-in { padding: 4px 18px 18px; border-top: 1px solid var(--line); }
  .attr-lore { margin-top: 14px; }
  .attr-lore .tt { font-family: var(--font-d); font-weight: 700; font-size: 15px; }
  .attr-lore .dd { font-size: 13px; color: var(--mut); line-height: 1.55; margin-top: 6px; }
  .attr-lore .mv { font-size: 13px; color: var(--amber); font-style: italic; margin-top: 10px; }
  .attr-facts { display: flex; gap: 22px; margin-top: 14px; }
  .attr-facts .f .v { font-family: var(--font-d); font-weight: 700; font-size: 18px; }
  .attr-facts .f .k { font-size: 11px; color: var(--dim); margin-top: 3px; }
  .tier-track { display: flex; gap: 3px; margin-top: 14px; flex-wrap: wrap; }
  .tier-seg { flex: 1; min-width: 20px; height: 6px; border-radius: 3px; background: var(--card-3); }

  /* achievements */
  .ach-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .ach { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px; text-align: center; transition: border-color .2s; }
  .ach.earned { border-color: color-mix(in srgb, var(--amber) 40%, var(--line)); }
  .ach .emb { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 26px; background: var(--card-3); border: 2px solid var(--line); position: relative; }
  .ach.earned .emb { background: radial-gradient(circle, #2a2412, var(--card-3)); border-color: var(--amber); box-shadow: 0 0 18px rgba(255,178,62,.3); }
  .ach.locked .emb { filter: grayscale(1) brightness(.5); }
  .ach .emb .tlv { position: absolute; bottom: -4px; right: -4px; background: var(--amber); color: #0a0b10; font-size: 10px; font-weight: 800; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg-2); }
  .ach .an { font-family: var(--font-d); font-weight: 700; font-size: 13px; }
  .ach .ad { font-size: 11px; color: var(--mut); margin-top: 4px; line-height: 1.4; }
  .ach .ap { font-size: 11px; color: var(--dim); margin-top: 8px; }
  .ach .pips { display: flex; gap: 3px; justify-content: center; margin-top: 8px; }
  .ach .pip { width: 7px; height: 7px; border-radius: 50%; background: var(--card-3); border: 1px solid var(--line); }
  .ach .pip.on { background: var(--amber); border-color: var(--amber); }

  /* ===== CALENDAR ===== */
  .cal-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .cal-nav { display: flex; align-items: center; gap: 10px; }
  .cal-nav button { width: 34px; height: 34px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); color: var(--txt); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
  .cal-nav button:hover { border-color: var(--line-lit); }
  .cal-title { font-family: var(--font-d); font-weight: 700; font-size: 18px; min-width: 170px; text-align: center; }
  .cal-legend { display: flex; align-items: center; gap: 12px; font-size: 11px; color: var(--mut); }
  .cal-legend .lg { display: flex; align-items: center; gap: 6px; }
  .cal-legend .sw { width: 13px; height: 13px; border-radius: 4px; }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .cal-dow { text-align: center; font-size: 11px; color: var(--dim); font-weight: 600; letter-spacing: .06em; padding-bottom: 4px; }
  .cal-cell { aspect-ratio: 1; border-radius: 12px; background: var(--card); border: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; position: relative; cursor: pointer; transition: border-color .15s, transform .1s; }
  .cal-cell:hover { border-color: var(--line-lit); transform: translateY(-1px); }
  .cal-cell.empty { background: transparent; border: none; cursor: default; }
  .cal-cell.empty:hover { transform: none; }

  function load(){ try{ const v=localStorage.getItem(KEY); if(v) state=JSON.parse(v); }catch(e){ console.error('load failed',e); } }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ console.error('save failed',e); } }

  function rollover(){
    if(!state) return false; const t=todayKey(); if(state.lastSeenDay===t) return false;
    const prev=state.lastSeenDay; let broke=false;
    if(prev&&dbtw(prev,t)>=1){
      state.quests.forEach(q=>{ if(!q.lastDone||dbtw(q.lastDone,t)>1){ if(q.streak){q.streak=0;broke=true;} } });
      if(state.lastAllClearDay&&dbtw(state.lastAllClearDay,t)>1){ if(state.globalStreak){state.globalStreak=0;broke=true;} }
    }
    state.lastSeenDay=t; save(); return broke;
  }
  let midnight=null;
  function schedMidnight(){ clearTimeout(midnight); const now=new Date(); const nx=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1,0,0,5); midnight=setTimeout(()=>{const b=rollover();render();toast(b?'A new day. Some streaks reset.':'A new day begins.',b?'':'lime');schedMidnight();},nx-now); }

  function todaysCard(){ const d=todayKey(); let h=0; for(let i=0;i<d.length;i++) h=(h*31+d.charCodeAt(i))>>>0; return CARDS[h%CARDS.length]; }
  function levelFloor(){ let t=0; for(let l=1;l<state.level;l++) t+=xpForLevel(l); return t; }
  function recompute(){ let lvl=1,need=0; while(state.xp>=need+xpForLevel(lvl)){need+=xpForLevel(lvl);lvl++;if(lvl>999)break;} state.level=lvl; }

  // ---- attribute points ----
  // CURRENT: sum of attribute points earned across all completions in history.
  function attrPoints(s){
    const pts={}; ATTRS.forEach(a=>pts[a.key]=0);
    s.quests.forEach(q=>{
      const map=QUEST_ATTR[q.icon]||QUEST_ATTR.star;
      const times=(q.history||[]).length;
      for(const k in map) pts[k]+=map[k]*times;
    });
    return pts;
  }
  // DAY: attribute points earned today only.
  function attrPointsDay(s){
    const t=todayKey(); const pts={}; ATTRS.forEach(a=>pts[a.key]=0);
    s.quests.forEach(q=>{ if((q.history||[]).includes(t)){ const map=QUEST_ATTR[q.icon]||QUEST_ATTR.star; for(const k in map) pts[k]+=map[k]; } });
    return pts;
  }
  // POTENTIAL: points if every quest were completed every day for the full 66-day arc.
  function attrPointsPotential(s){
    const pts={}; ATTRS.forEach(a=>pts[a.key]=0);
    s.quests.forEach(q=>{ const map=QUEST_ATTR[q.icon]||QUEST_ATTR.star; for(const k in map) pts[k]+=map[k]*66; });
    return pts;
  }
  function overallLevel(s){ const p=attrPoints(s); let sum=0; ATTRS.forEach(a=>sum+=levelFromPoints(p[a.key]).level); return Math.round(sum/ATTRS.length); }
  function totalCompletions(s){ return s.quests.reduce((a,q)=>a+(q.history||[]).length,0); }

  const TITLES=['Awakened','Novice Hunter','Iron Seeker','Ascendant','Shadowbound','Stormforged','Duskblade','Voidwalker','Sovereign','Monarch'];
  const rank=lv=>TITLES[Math.min(TITLES.length-1,Math.floor((lv-1)/3))];

  let toasts=[];
  function toast(m,c){ toasts.push({m,c:c||''}); rt(); setTimeout(()=>{toasts.shift();rt();},2600); }
  function rt(){ let l=document.querySelector('.toast-l'); if(!l){l=document.createElement('div');l.className='toast-l';document.body.appendChild(l);} l.innerHTML=toasts.map(t=>'<div class="toast '+t.c+'">'+t.m+'</div>').join(''); }
  let lut=null;
  function lvlup(lv){ const e=document.createElement('div');e.className='lvlup';e.innerHTML='<div class="b"><div class="big">LVL '+lv+'</div><div class="sub">'+rank(lv)+'</div></div>';document.body.appendChild(e);clearTimeout(lut);lut=setTimeout(()=>e.remove(),1800); }

  function completeQuest(id){
    const q=state.quests.find(x=>x.id===id); if(!q) return; const t=todayKey(); if(q.lastDone===t) return;
    q.prevDone=q.lastDone;
    if(q.lastDone&&dbtw(q.lastDone,t)===1) q.streak=(q.streak||0)+1; else q.streak=1;
    q.lastDone=t; if(!q.history) q.history=[]; if(!q.history.includes(t)) q.history.push(t);
    let gain=DIFFS[q.diff].xp; const bonus=Math.min(q.streak-1,20)*2; gain+=bonus; state.xp+=gain;
    const all=state.quests.every(x=>x.lastDone===t);
    if(all){ if(state.lastAllClearDay&&dbtw(state.lastAllClearDay,t)===1) state.globalStreak+=1; else if(state.lastAllClearDay!==t) state.globalStreak=1; state.lastAllClearDay=t; }
    const before=state.level; recompute(); save();
    if(state.level>before) lvlup(state.level);
    else { toast('+'+gain+' XP'+(bonus?' \u00b7 streak +'+bonus:''),q.keystone?'gold':'lime'); if(all) setTimeout(()=>toast('All quests cleared \uD83C\uDF89','gold'),380); }
    render();
  }
  function uncomplete(id){ const q=state.quests.find(x=>x.id===id); if(!q||q.lastDone!==todayKey()) return; const t=todayKey(); q.history=(q.history||[]).filter(d=>d!==t); q.lastDone=q.prevDone||null; state.xp=Math.max(0,state.xp-DIFFS[q.diff].xp); q.streak=Math.max(0,q.streak-1); recompute(); save(); render(); }

  function toggleSub(qid,idx){ const q=state.quests.find(x=>x.id===qid); if(!q) return; q.subs[idx].done=!q.subs[idx].done; save(); render(); }
  function addSub(qid,txt){ txt=txt.trim(); if(!txt) return; const q=state.quests.find(x=>x.id===qid); q.subs.push({t:txt,done:false}); save(); render(); }
  function saveNotes(qid,val){ const q=state.quests.find(x=>x.id===qid); if(q){ q.notes=val; save(); } }

  function toggleMs(id){ const m=state.milestones.find(x=>x.id===id); if(!m) return; m.done=!m.done;
    if(m.done){ state.xp+=m.xp; const b=state.level; recompute(); save(); if(state.level>b) lvlup(state.level); else toast('Milestone claimed +'+m.xp+' XP','gold'); }
    else { state.xp=Math.max(0,state.xp-m.xp); recompute(); save(); } render(); }
  function toggleMsSub(mid,idx){ const m=state.milestones.find(x=>x.id===mid); if(!m) return; m.subs[idx].done=!m.subs[idx].done; save(); render(); }

  function addQuest(name){ name=name.trim(); if(!name) return; state.quests.push({id:state.nextId++,name,icon:'star',diff:pendingDiff,streak:0,lastDone:null,history:[],notes:'',subs:[],why:'',time:'',topic:''}); save(); render(); }
  function delQuest(id){ state.quests=state.quests.filter(q=>q.id!==id); save(); render(); }
  function hardReset(){ if(!confirm('Erase your hunter and all progress?')) return; try{ localStorage.removeItem(KEY); }catch(e){} state=null; render(); }

  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const tick=c=>'<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="'+(c||'#0a0b10')+'" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const msProgress=m=>{ if(!m.subs||!m.subs.length) return m.done?100:0; return Math.round(m.subs.filter(s=>s.done).length/m.subs.length*100); };

  // ===== TODAY =====
  function renderToday(){
    const t=todayKey(); const day=dbtw(state.startDate,t)+1;
    const done=state.quests.filter(q=>q.lastDone===t).length, total=state.quests.length;
    const need=xpForLevel(state.level), into=state.xp-levelFloor(), pct=need?Math.min(100,into/need*100):0;
    const R=36, C=2*Math.PI*R; const c=todaysCard();
    const cards=state.quests.map(q=>{
      const d=DIFFS[q.diff], dn=q.lastDone===t, open=openQ===q.id;
      const subsDone=q.subs.filter(s=>s.done).length;
      const last14=[]; for(let i=13;i>=0;i--){ const dd=new Date(); dd.setDate(dd.getDate()-i); const k=dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0'); last14.push((q.history||[]).includes(k)); }
      return `<div class="qcard ${dn?'done':''} ${q.keystone?'keystone':''} ${open?'open':''}">

          <div class="q-ic" style="--tint:${d.color}22">${ICONS[q.icon]||ICONS.star}</div>
          <div class="q-main">

            </div>

        </div>

            </div>

        <div class="hero-mid"><div class="rk">${rank(state.level)}</div><div class="dd">${done}/${total} quests cleared today</div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><div class="xl">${into} / ${need} XP \u00b7 ${need-into} to level ${state.level+1}</div></div>

      ${cards}`;
    return shell(main);
  }

  function renderJourney(){
    const era=ERAS.find(e=>e.key===msEra)||ERAS[0];
    const items=state.milestones.filter(m=>m.era===msEra);

              <h5>Sub-steps \u00b7 ${subsDone}/${m.subs.length}</h5>

      <div class="slab"><h3>Milestones</h3><span class="ct">${items.filter(m=>m.done).length}/${items.length} claimed \u00b7 click for detail</span></div>

  }

  // ===== RATING =====
  function renderRating(){
    const cur=attrPoints(state), day=attrPointsDay(state), pot=attrPointsPotential(state);
    // overall ratings = average level across attrs
    const lvlOf=p=>levelFromPoints(p).level;
    const avg=obj=>{ let s=0; ATTRS.forEach(a=>s+=lvlOf(obj[a.key])); return Math.round(s/ATTRS.length); };
    const curOv=avg(cur), potOv=avg(pot);
    // day rating: today's level-equivalents (small numbers) — express as % of potential day
    const dayOv=(()=>{
      const totalDayPts=ATTRS.reduce((x,a)=>x+day[a.key],0);
      const maxDayPts=state.quests.reduce((x,q)=>{ const m=QUEST_ATTR[q.icon]||QUEST_ATTR.star; return x+Object.values(m).reduce((y,v)=>y+v,0); },0);
      return maxDayPts?Math.round(totalDayPts/maxDayPts*100):0;
    })();
    const curTier=tierForLevel(curOv), potTier=tierForLevel(potOv);

    const ratingHd=`<div class="rating-hd">
      <div class="rt-card cur"><div class="rl">Current</div><div class="rv">${curOv}</div><div class="rt" style="color:${curTier.color}">${curTier.label}</div><div class="rsub">Overall level now</div></div>
      <div class="rt-card pot"><div class="rl">Potential</div><div class="rv">${potOv}</div><div class="rt" style="color:${potTier.color}">${potTier.label}</div><div class="rsub">If you clear all quests \u00d7 66 days</div></div>
      <div class="rt-card day"><div class="rl">Day</div><div class="rv">${dayOv}<span style="font-size:20px">%</span></div><div class="rt">Today\u2019s output</div><div class="rsub">${ATTRS.reduce((x,a)=>x+day[a.key],0)} attribute pts today</div></div>
    </div>`;

    // Overall attribute card first, then the 7
    const overallCard=(()=>{
      const lv=curOv, li=levelFromPoints(0); const t=tierForLevel(lv); const lore=levelLore(lv);
      const potL=potOv, pctToPot=potL>0?Math.min(100,lv/potL*100):0;
      const open=openA==='overall';
      return `<div class="attr-card ${open?'open':''}">
        <div class="attr-head" data-attr="overall">
          <div class="attr-ic" style="background:#f5c85c22">\uD83D\uDC51</div>
          <div class="attr-mid">
            <div class="attr-name">Overall <span class="attr-tier" style="background:${t.color}">${t.label}</span></div>
            <div class="attr-bar"><div class="attr-fill" style="width:${pctToPot}%;background:${t.color}"></div></div>
          </div>
          <div class="attr-lv"><div class="n" style="color:${t.color}">${lv}</div><div class="l">of ${potL}</div></div>
        </div>
        <div class="attr-detail"><div class="attr-detail-in"><div class="attr-lore">
          <div class="tt" style="color:${t.color}">${lore.title}</div>
          <div class="dd">${lore.desc} Overall is the average of your seven attributes \u2014 raise them and this rises with them.</div>
          <div class="mv">\u201C${lore.motive}\u201D</div>
          <div class="attr-facts"><div class="f"><div class="v">${lv}/1000</div><div class="k">Current level</div></div><div class="f"><div class="v">${potL}</div><div class="k">Potential cap</div></div><div class="f"><div class="v">${totalCompletions(state)}</div><div class="k">Total tasks done</div></div></div>
        </div></div></div>
      </div>`;
    })();

    const attrCards=ATTRS.map(a=>{
      const lf=levelFromPoints(cur[a.key]); const lv=lf.level; const t=tierForLevel(lv); const lore=levelLore(lv);
      const potL=levelFromPoints(pot[a.key]).level; const pctToPot=potL>0?Math.min(100,lv/potL*100):0;
      const intoPct=lf.need?Math.round(lf.into/lf.need*100):0;
      const open=openA===a.key;
      // count tasks feeding this attr
      const feeders=state.quests.filter(q=>{ const m=QUEST_ATTR[q.icon]||QUEST_ATTR.star; return m[a.key]; });
      const tasksDone=feeders.reduce((x,q)=>x+(q.history||[]).length,0);
      // tier ladder segments (8 tiers)
      const tierIdx=TIERS.findIndex(x=>x.n===t.tier); const segs=TIERS.map((x,i)=>`<div class="tier-seg" style="${i<=tierIdx?'background:'+x.c:''}"></div>`).join('')+`<div class="tier-seg" style="${t.tier==='Ascendant'?'background:#b8f43a':''}"></div>`;
      return `<div class="attr-card ${open?'open':''}">
        <div class="attr-head" data-attr="${a.key}">
          <div class="attr-ic" style="background:${a.color}22">${a.icon}</div>
          <div class="attr-mid">
            <div class="attr-name">${a.name} <span class="attr-tier" style="background:${t.color}">${t.label}</span></div>
            <div class="attr-bar"><div class="attr-fill" style="width:${pctToPot}%;background:${a.color}"></div></div>
          </div>
          <div class="attr-lv"><div class="n" style="color:${a.color}">${lv}</div><div class="l">of ${potL}</div></div>
        </div>
        <div class="attr-detail"><div class="attr-detail-in">
          <div class="tier-track">${segs}</div>
          <div class="attr-lore">
            <div class="tt" style="color:${t.color}">${lore.title}</div>
            <div class="dd">${lore.desc}</div>
            <div class="mv">\u201C${lore.motive}\u201D</div>
          </div>
          <div class="attr-facts">
            <div class="f"><div class="v">${lv}/1000</div><div class="k">Level (${intoPct}% to next)</div></div>
            <div class="f"><div class="v">${tasksDone}</div><div class="k">Tasks feeding this</div></div>
            <div class="f"><div class="v">${cur[a.key]}</div><div class="k">Points earned</div></div>
          </div>
        </div></div>
      </div>`;
    }).join('');

    // achievements
    const achCards=ACHIEVEMENTS.map(a=>{
      const st=achievementTier(a,state); const earned=st.tier>0;
      const pips=a.tiers.map((_,i)=>`<div class="pip ${i<st.tier?'on':''}"></div>`).join('');
      return `<div class="ach ${earned?'earned':'locked'}">
        <div class="emb">${a.icon}${earned?`<div class="tlv">${st.tier}</div>`:''}</div>
        <div class="an">${a.name}</div>
        <div class="ad">${a.desc}</div>
        <div class="pips">${pips}</div>
        <div class="ap">${st.next?st.value+' / '+st.next+' \u2192 tier '+(st.tier+1):'MAX \u00b7 tier '+st.tier}</div>
      </div>`;
    }).join('');

    const main=`
      <div class="page-head"><div><h1>My Life Reset Rating</h1><div class="sub">Every quest you clear raises the attributes it trains</div></div></div>
      ${ratingHd}
      <div class="slab"><h3>Attributes</h3><span class="ct">click an attribute for its tier, title & motivation</span></div>
      <div class="attr-list">${overallCard}${attrCards}</div>
      <div class="slab" style="margin-top:28px"><h3>Achievements</h3><span class="ct">${ACHIEVEMENTS.filter(a=>achievementTier(a,state).tier>0).length}/${ACHIEVEMENTS.length} unlocked</span></div>
      <div class="ach-grid">${achCards}</div>`;
    return shell(main);
  }

  // ===== CALENDAR =====
  // Per-day completion data reconstructed from each quest's history array.
  function dayData(dateKey){
    const doneQuests=state.quests.filter(q=>(q.history||[]).includes(dateKey));
    const total=state.quests.length;
    return { done:doneQuests.length, total, quests:doneQuests, allClear: total>0 && doneQuests.length===total };
  }
  function fmtKey(y,m,d){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
  function heatColor(ratio){
    if(ratio<=0) return null;
    if(ratio>=1) return 'var(--lime)';
    if(ratio>=0.66) return '#7fd41f';
    if(ratio>=0.33) return '#ffb23e';
    return '#ff5c7a';
  }

  function renderCalendar(){
    const now=new Date();
    if(!calCursor) calCursor={ y:now.getFullYear(), m:now.getMonth() };
    const {y,m}=calCursor;
    const first=new Date(y,m,1); const startDow=first.getDay();
    const daysInMonth=new Date(y,m+1,0).getDate();
    const monthName=first.toLocaleString('en-US',{month:'long',year:'numeric'});
    const todayK=todayKey();

    // month stats
    let monthDaysActive=0, monthAllClear=0, monthCompletions=0;
    for(let d=1; d<=daysInMonth; d++){ const k=fmtKey(y,m,d); const dd=dayData(k); if(dd.done>0) monthDaysActive++; if(dd.allClear) monthAllClear++; monthCompletions+=dd.done; }

    // all-time perfect days + active days
    const allDates=new Set(); state.quests.forEach(q=>(q.history||[]).forEach(d=>allDates.add(d)));
    let perfectAll=0; allDates.forEach(k=>{ if(dayData(k).allClear) perfectAll++; });
    const arcDay=dbtw(state.startDate,todayK)+1;
    const consistency=arcDay>0?Math.round(allDates.size/arcDay*100):0;

    // build cells
    let cells='';
    ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>cells+=`<div class="cal-dow">${d}</div>`);
    for(let i=0;i<startDow;i++) cells+=`<div class="cal-cell empty"></div>`;
    for(let d=1; d<=daysInMonth; d++){
      const k=fmtKey(y,m,d);
      const dd=dayData(k);
      const isToday=k===todayK;
      const isFuture=new Date(y,m,d) > new Date(now.getFullYear(),now.getMonth(),now.getDate());
      const isSel=k===calSel;
      const ratio=dd.total?dd.done/dd.total:0;
      const col=heatColor(ratio);
      cells+=`<div class="cal-cell ${isToday?'today':''} ${isSel?'sel':''} ${isFuture?'future':''}" ${isFuture?'':`data-cal="${k}"`}>
        <div class="dn">${d}</div>
        ${dd.allClear?'<div class="allclear">\u2b50</div>':''}
        ${!isFuture&&dd.done>0?`<div class="cnt">${dd.done}/${dd.total}</div>`:''}
        <div class="dbar">${col?`<div class="dfill" style="width:${ratio*100}%;background:${col}"></div>`:''}</div>
      </div>`;
    }

    // selected-day detail
    let detail='';
    if(calSel){
      const dd=dayData(calSel);
      const dateObj=new Date(calSel+'T00:00:00');
      const nice=dateObj.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
      const chips=state.quests.map(q=>{ const hit=(q.history||[]).includes(calSel); return `<div class="cq ${hit?'hit':''}">${ICONS[q.icon]||ICONS.star} ${esc(q.name)}</div>`; }).join('');
      detail=`<div class="cal-detail">
        <div class="cd-date">${nice}</div>
        <div class="cd-sum">${dd.done}/${dd.total} quests cleared${dd.allClear?' \u00b7 \u2b50 perfect day':''}</div>
        <div class="cd-quests">${chips}</div>
      </div>`;
    } else {
      detail=`<div class="cal-detail"><div class="cd-sum">Click any day to see which quests you cleared.</div></div>`;
    }

    const main=`
      <div class="page-head"><div><h1>Calendar</h1><div class="sub">Your completion history, day by day</div></div></div>
      <div class="cal-stats">
        <div class="cal-stat a"><div class="v">${allDates.size}</div><div class="k">Active days total</div></div>
        <div class="cal-stat d"><div class="v">${perfectAll}</div><div class="k">Perfect days (all cleared)</div></div>
        <div class="cal-stat b"><div class="v">${state.globalStreak}</div><div class="k">Current streak</div></div>
        <div class="cal-stat c"><div class="v">${consistency}%</div><div class="k">Consistency (active/arc days)</div></div>
      </div>
      <div class="cal-top">
        <div class="cal-nav"><button data-calmove="-1">\u2039</button><div class="cal-title">${monthName}</div><button data-calmove="1">\u203a</button></div>
        <div class="cal-legend">
          <div class="lg"><span class="sw" style="background:#ff5c7a"></span>low</div>
          <div class="lg"><span class="sw" style="background:#ffb23e"></span>mid</div>
          <div class="lg"><span class="sw" style="background:var(--lime)"></span>all</div>
          <div class="lg">\u2b50 perfect</div>
        </div>
      </div>
      <div class="cal-grid">${cells}</div>
      <div style="margin-top:16px;font-size:13px;color:var(--mut)">This month: <b style="color:var(--txt)">${monthDaysActive}</b> active days \u00b7 <b style="color:var(--amber)">${monthAllClear}</b> perfect \u00b7 <b style="color:var(--lime)">${monthCompletions}</b> total completions</div>
      ${detail}`;
    return shell(main);
  }

  // ===== STATS =====
  function renderStats(){
    const t=todayKey(); const day=dbtw(state.startDate,t)+1;
    const done=state.quests.filter(q=>q.lastDone===t).length;
    const best=Math.max(0,...state.quests.map(q=>q.streak||0));
    const totalDone=state.quests.reduce((a,q)=>a+(q.history||[]).length,0);
    const msDone=state.milestones.filter(m=>m.done).length;
    const need=xpForLevel(state.level),into=state.xp-levelFloor(),pct=Math.min(100,into/need*100);
    const main=`
      <div class="page-head"><div><h1>Stats</h1><div class="sub">Your progress at a glance</div></div></div>
      <div class="stat-grid">
        <div class="stat-box a"><div class="v">${day}</div><div class="k">Day of 66-day arc</div></div>
        <div class="stat-box b"><div class="v">${state.globalStreak}</div><div class="k">Current streak</div></div>
        <div class="stat-box c"><div class="v">${state.xp}</div><div class="k">Total XP earned</div></div>
        <div class="stat-box d"><div class="v">${state.level}</div><div class="k">Level \u00b7 ${rank(state.level)}</div></div>
        <div class="stat-box a"><div class="v">${done}/${state.quests.length}</div><div class="k">Cleared today</div></div>
        <div class="stat-box b"><div class="v">\uD83D\uDD25${best}</div><div class="k">Best quest streak</div></div>
        <div class="stat-box c"><div class="v">${totalDone}</div><div class="k">Total completions</div></div>
        <div class="stat-box d"><div class="v">${msDone}/${state.milestones.length}</div><div class="k">Milestones claimed</div></div>
      </div>
      <div class="slab" style="margin-top:26px"><h3>Progress to level ${state.level+1}</h3></div>
      <div class="hero-mid"><div class="bar" style="max-width:none;height:12px"><div class="fill" style="width:${pct}%"></div></div><div class="xl">${into} / ${need} XP</div></div>
      <div class="slab" style="margin-top:26px"><h3>Milestones by era</h3></div>
      ${ERAS.map(e=>{const it=state.milestones.filter(m=>m.era===e.key);const dn=it.filter(m=>m.done).length;const p=it.length?Math.round(dn/it.length*100):0;return `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span style="color:${e.color};font-weight:600">${e.name}</span><span style="color:var(--mut)">${dn}/${it.length}</span></div><div class="bar" style="max-width:none"><div class="fill" style="width:${p}%;background:${e.color}"></div></div></div>`;}).join('')}`;
    return shell(main);
  }

  // ===== ME =====
  function renderMe(){
    const rows=state.quests.map(q=>`<div class="manage-row"><div class="q-ic" style="--tint:${DIFFS[q.diff].color}22;width:34px;height:34px;font-size:16px;border-radius:9px">${ICONS[q.icon]||ICONS.star}</div><div class="mn">${esc(q.name)}${q.keystone?' \u2605':''}</div><span class="chip diff" style="background:${DIFFS[q.diff].color}">+${DIFFS[q.diff].xp}</span><button class="del" data-del="${q.id}">\u00d7</button></div>`).join('');
    const dbtn=Object.entries(DIFFS).map(([k,d])=>`<div class="d ${pendingDiff===k?'on':''}" data-diff="${k}" style="${pendingDiff===k?'background:'+d.color:''}">${d.label} \u00b7 ${d.xp}</div>`).join('');
    const main=`
      <div class="page-head"><div><h1>Me</h1><div class="sub">${rank(state.level)} \u00b7 Level ${state.level} \u00b7 ${state.xp} XP</div></div></div>
      <div class="slab"><h3>Your Quests</h3><span class="ct">${state.quests.length} active</span></div>
      <p class="hint">Seeded from your daily tracker with full reference detail. Add your own or remove what doesn\u2019t fit this season \u2014 new quests get sub-tasks, notes, and history too.</p>
      ${rows}
      <div class="add-panel">
        <div class="row" style="margin-bottom:12px"><input class="t" id="nq" type="text" placeholder="Name a new daily quest" maxlength="60" autocomplete="off"/><button class="btn lime" id="addb">Add quest</button></div>
        <div class="diffs">${dbtn}</div>
      </div>
      <div style="margin-top:22px;display:flex;gap:10px"><button class="btn gho" id="rst">Reset hunter</button></div>
      <p class="hint" style="margin-top:14px">Progress saves automatically to this device. Quests reset each morning; streaks break on a missed day.</p>`;
    return shell(main);
  }

  function bind(){
    document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',()=>{ tab=el.dataset.nav; render(); }));
    document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',e=>{ if(e.target.closest('[data-tick]')) return; const id=+el.dataset.open; openQ=openQ===id?null:id; render(); }));
    document.querySelectorAll('[data-tick]').forEach(el=>el.addEventListener('click',e=>{ e.stopPropagation(); const id=+el.dataset.tick; if(el.classList.contains('on')) uncomplete(id); else completeQuest(id); }));
    document.querySelectorAll('[data-sub]').forEach(el=>el.addEventListener('click',()=>{ const [q,i]=el.dataset.sub.split(':'); toggleSub(+q,+i); }));
    document.querySelectorAll('[data-subbtn]').forEach(el=>el.addEventListener('click',()=>{ const qid=+el.dataset.subbtn; const inp=document.querySelector('[data-subadd="'+qid+'"]'); if(inp&&inp.value.trim()) addSub(qid,inp.value); }));
    document.querySelectorAll('[data-subadd]').forEach(el=>el.addEventListener('keydown',e=>{ if(e.key==='Enter'&&el.value.trim()) addSub(+el.dataset.subadd,el.value); }));
    document.querySelectorAll('[data-notes]').forEach(el=>{ let tmr; el.addEventListener('input',()=>{ clearTimeout(tmr); tmr=setTimeout(()=>saveNotes(+el.dataset.notes,el.value),500); }); el.addEventListener('click',e=>e.stopPropagation()); });
    document.querySelectorAll('[data-mopen]').forEach(el=>el.addEventListener('click',()=>{ const id=+el.dataset.mopen; openM=openM===id?null:id; render(); }));
    document.querySelectorAll('[data-mstick]').forEach(el=>el.addEventListener('click',e=>{ e.stopPropagation(); toggleMs(+el.dataset.mstick); }));
    document.querySelectorAll('[data-mssub]').forEach(el=>el.addEventListener('click',()=>{ const [m,i]=el.dataset.mssub.split(':'); toggleMsSub(+m,+i); }));
    document.querySelectorAll('[data-era]').forEach(el=>el.addEventListener('click',()=>{ msEra=el.dataset.era; openM=null; render(); }));
    document.querySelectorAll('[data-attr]').forEach(el=>el.addEventListener('click',()=>{ const k=el.dataset.attr; openA=openA===k?null:k; render(); }));
    document.querySelectorAll('[data-calmove]').forEach(el=>el.addEventListener('click',()=>{ const dir=+el.dataset.calmove; let mm=calCursor.m+dir, yy=calCursor.y; if(mm<0){mm=11;yy--;} if(mm>11){mm=0;yy++;} calCursor={y:yy,m:mm}; render(); }));
    document.querySelectorAll('[data-cal]').forEach(el=>el.addEventListener('click',()=>{ calSel=calSel===el.dataset.cal?null:el.dataset.cal; render(); }));
    document.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click',()=>delQuest(+el.dataset.del)));
    document.querySelectorAll('[data-diff]').forEach(el=>el.addEventListener('click',()=>{ pendingDiff=el.dataset.diff; render(); }));
    const nq=document.getElementById('nq'),ab=document.getElementById('addb');
    if(ab){ ab.addEventListener('click',()=>{ if(nq.value.trim()) addQuest(nq.value); }); nq.addEventListener('keydown',e=>{if(e.key==='Enter'&&nq.value.trim())addQuest(nq.value);}); }
    const rst=document.getElementById('rst'); if(rst) rst.addEventListener('click',hardReset);
  }

  function render(){
    if(!state){ renderOb(); return; }
    if(tab==='today') $root.innerHTML=renderToday();
    else if(tab==='journey') $root.innerHTML=renderJourney();
    else if(tab==='rating') $root.innerHTML=renderRating();
    else if(tab==='stats') $root.innerHTML=renderStats();
    else if(tab==='calendar') $root.innerHTML=renderCalendar();
    else $root.innerHTML=renderMe();
    bind();
  }

  (async function boot(){
    $root.innerHTML='<div class="loading">SUMMONING\u2026</div>';
    await load();
    if(state){ if(!state.lastSeenDay) state.lastSeenDay=state.startDate||todayKey(); const b=rollover(); schedMidnight(); render(); if(b) setTimeout(()=>toast('Welcome back. A missed day reset some streaks.',''),400); }
    else render();
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&state){ const b=rollover(); render(); schedMidnight(); if(b) toast('A new day. Some streaks reset.',''); } });
  })();
})();
</script>
